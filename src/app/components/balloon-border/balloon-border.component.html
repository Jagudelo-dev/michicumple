<div class="balloon-border" aria-hidden="true">
  @for (balloon of balloons; track balloon.id) {
    <span
      class="balloon"
      [style.color]="balloon.color"
      [style.--balloon-x]="balloon.x + '%'"
      [style.--balloon-duration]="balloon.duration + 's'"
      [style.--balloon-delay]="balloon.delay + 's'"
      (animationiteration)="respawn($event)"
    ></span>
  }
</div>
