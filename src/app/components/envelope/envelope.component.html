<div
  #backdrop
  class="modal-backdrop"
  [class.active]="isOpen()"
  (click)="onBackdropClick($event)"
  aria-hidden="true"
></div>

@if (isOpen()) {
  <button class="close-button" type="button" aria-label="Cerrar carta" (click)="close()">×</button>
}

<section #scene class="envelope-scene" [class.is-open]="isOpen()" [attr.data-state]="state()" [attr.aria-modal]="isOpen()" [attr.role]="isOpen() ? 'dialog' : null" [attr.aria-expanded]="isOpen()">
  <div
    class="envelope"
    role="button"
    tabindex="0"
    aria-label="Sobre de cumpleaños. Activa para abrir."
    (click)="open()"
    (keydown)="onEnvelopeKeydown($event)"
  >
    <article #letter class="letter" [class.is-visible]="state() !== 'closed'" aria-label="Carta de cumpleaños">
      <p class="letter-date">{{ texts.letterIntro }}</p>
      <h2>{{ texts.letterHeading }}</h2>
      @for (paragraph of texts.letterParagraphs; track $index) {
        <p>{{ paragraph }}</p>
      }
      <p class="letter-signoff">{{ texts.letterSignoff }}</p>
    </article>

    <div class="envelope-body"></div>
    <div class="envelope-pocket"></div>
    <div #flap class="envelope-flap"></div>
    <div class="seal" aria-hidden="true"><span class="heart">♥</span><span class="initial">A</span></div>
    <span class="open-label">Ábreme</span>
  </div>
</section>
